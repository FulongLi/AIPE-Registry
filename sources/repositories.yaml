schema_version: 0.1.0
# Every merged capability is pinned to an immutable default-branch commit (state: pinned); refresh.py --remote
# verifies that the commit resolves and captures the manifest from it. pending_pr entries point at an unmerged
# pull-request head and are re-pinned when that PR is merged.
# AIPE-Design-Agent was renamed AIPE-Electrical-Design and HeatSinkOptimisation became AIPE-Thermal-Design (2026-10-21);
# the capability id aipe.design-agent is kept until the Electrical-Design refactor publishes aipe.electrical-design.
# AIPE-Sketch was renamed AIPE-Sketcher (v0.2.0); the stable capability id aipe.sketch is unchanged.
repositories:
  - {id: aipe.core, repository: 'https://github.com/FulongLi/AIPE-Core', ref: 4e664f03df1e294fefc169244bf1223c7352e2be, state: pinned, path: aipe.yaml}
